<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Introduction – Quiz Persona 5 Difficile</title>

    <style>
        body {
            background: url("c:/Users/Maxime/Pictures/fond_quiz_Persona5_difficile.png") no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: -1;
        }

        .container {
            background: rgba(255,255,255,0.4);
            padding: 30px;
            border-radius: 15px;
            max-width: 700px;
            margin: auto;
            text-align: center;
            backdrop-filter: blur(6px);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #d00000;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* TEXTE ROUGE + CONTOUR NOIR + AURA ÉCARLATE */
        .texte-aura {
            color: red;
            font-weight: bold;
            text-shadow:
                -2px -2px 0 black,
                 2px -2px 0 black,
                -2px  2px 0 black,
                 2px  2px 0 black,
                0px 0px 10px #ff0000,
                0px 0px 20px #ff0000,
                0px 0px 30px #ff0000,
                0px 0px 40px #ff0000;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="texte-aura">Quiz Persona 5 – Difficulté Difficile</h1>

    <p class="texte-aura">
        Seuls les véritables Voleurs Fantômes peuvent relever ce défi.  
        Prépare-toi à affronter des questions complexes, des détails cachés  
        et des pièges dignes du Metaverse.  
        Es-tu prêt à voler la vérité ?
    </p>

    <button onclick="window.location.href='quiz-persona5-difficile.html'">
        Commencer le quiz
    </button>

    <!-- BOUTON ON/OFF MUSIQUE -->
    <button id="toggleMusique" onclick="toggleMusique()">Activer la musique</button>

</div>

<!-- MUSIQUE -->
<audio id="musiquePersona" src="c:/Users/Maxime/Music/music_quiz_persona5_DIFFICILE.mp3" loop></audio>

<script>
    const audio = document.getElementById("musiquePersona");
    const bouton = document.getElementById("toggleMusique");
    let musiqueActive = false;

    function toggleMusique() {
        if (!musiqueActive) {
            audio.volume = 0.4;
            audio.play();
            musiqueActive = true;
            bouton.textContent = "Désactiver la musique";
        } else {
            audio.pause();
            musiqueActive = false;
            bouton.textContent = "Activer la musique";
        }
    }
</script>

</body>
</html>
