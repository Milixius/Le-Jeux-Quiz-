<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quiz Persona 5 - Introduction</title>

    <style>
        /* Bouton musique Persona */
#musiquePersonaBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;

    padding: 12px 25px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #ff003c, #000000);
    border: none;
    border-radius: 10px;
    cursor: pointer;

    box-shadow: 0 0 12px rgba(255, 0, 60, 0.7),
                0 0 12px rgba(0, 0, 0, 0.8);

    transition: 0.25s ease;
    z-index: 9999;
}

#musiquePersonaBtn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 18px rgba(255, 0, 60, 1),
                0 0 18px rgba(0, 0, 0, 1);
}

#musiquePersonaBtn:active {
    transform: scale(0.95);
}

        body {
            background: url("c:/Users/Maxime/Pictures/fond quiz Persona 5.png") no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 35px;
            border-radius: 15px;
            max-width: 650px;
            margin: auto;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            border: 2px solid #ff0000;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 32px;
            color: #ff0000;
            text-shadow: 2px 2px 0 #000;
            font-weight: bold;
        }

        p {
            font-size: 19px;
            margin-bottom: 10px;
            color: white;
            text-shadow: 1px 1px 0 black;
        }

        .start-btn {
            margin-top: 25px;
            padding: 15px 30px;
            font-size: 22px;
            border: none;
            border-radius: 10px;
            background: #ff0000;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            box-shadow: 0 0 10px black;
        }

        .start-btn:hover {
            transform: scale(1.08);
            background: #cc0000;
        }
    </style>

</head>
<body>
<button id="musiquePersonaBtn" onclick="toggleMusiquePersona()">Activer musique Persona</button>

<audio id="musiquePersona" src="c:\Users\Maxime\Music\musique_quiz_persona_facile.mp3" loop preload="auto"></audio>

    <div class="container">
        <h1>Quiz Persona 5 – Niveau Facile</h1>

        <p>Bienvenue dans le quiz Persona 5 facile !</p>
        <p>Tu vas répondre à 10 questions simples sur l’univers des Phantom Thieves.</p>
        <p>Chaque question propose 3 choix possibles.</p>
        <p>Prépare ton masque… et bonne chance !</p>

        <button class="start-btn" onclick="window.location.href='quiz-persona5-facile.html'">
            Commencer le quiz
        </button>
    </div>
<script>
let personaMusiqueActive = false;
const personaMusique = document.getElementById("musiquePersona");
const personaBtn = document.getElementById("musiquePersonaBtn");

function toggleMusiquePersona() {
    if (!personaMusiqueActive) {
        personaMusique.volume = 0.5;
        personaMusique.play();
        personaMusiqueActive = true;
        personaBtn.textContent = "Désactiver musique Persona";
    } else {
        personaMusique.pause();
        personaMusiqueActive = false;
        personaBtn.textContent = "Activer musique Persona";
    }
}
</script>

</body>
</html>
