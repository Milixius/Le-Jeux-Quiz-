<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Intro – Quiz Persona 5 (Moyen)</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Arial Black", sans-serif;
        color: white;
        text-align: center;

        background: url("c:/Users/Maxime/Pictures/fond_quiz_persona5_moyen.png") no-repeat center center fixed;
        background-size: cover;

        animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    .container {
        margin-top: 120px;
        background: rgba(0,0,0,0.65);
        padding: 40px;
        border-radius: 20px;
        width: 60%;
        margin-left: auto;
        margin-right: auto;
        box-shadow: 0 0 25px rgba(255,0,0,0.6);
        border: 3px solid #ff0000;
    }

    h1 {
        font-size: 50px;
        margin-bottom: 10px;
        text-shadow: 4px 4px 0 black;
        color: #ff0000;
        font-family: "Impact", sans-serif;
    }

    h2 {
        font-size: 28px;
        margin-bottom: 30px;
        color: #ffffff;
        text-shadow: 3px 3px 0 black;
    }

    p {
        font-size: 18px;
        margin-bottom: 30px;
        line-height: 1.5;
    }

    .btn-start {
        display: block;
        width: 280px;
        margin: 0 auto;
        padding: 15px;
        font-size: 24px;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        cursor: pointer;

        background: linear-gradient(135deg, #ff0000, #660000);
        color: white;
        box-shadow: 0 0 20px rgba(255,0,0,0.9);
        transition: 0.25s ease;
    }

    .btn-start:hover {
        transform: scale(1.1);
        box-shadow: 0 0 30px rgba(255,0,0,1);
    }

    /* Bouton musique Persona 5 */
    #musiqueP5Btn {
        position: fixed;
        bottom: 20px;
        right: 20px;

        padding: 12px 25px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background: linear-gradient(135deg, #ff0000, #000000);
        border: none;
        border-radius: 10px;
        cursor: pointer;

        box-shadow: 0 0 12px rgba(255,0,0,0.7),
                    0 0 12px rgba(0,0,0,0.8);
        transition: 0.25s ease;
        z-index: 9999;
    }

    #musiqueP5Btn:hover {
        transform: scale(1.1);
    }
</style>
</head>

<body>

<button id="musiqueP5Btn" onclick="toggleMusique()">Activer musique</button>
<audio id="musiqueP5" src="c:\Users\Maxime\Music\musique_quiz_persona5_moyen.mp3" loop preload="auto"></audio>

<div class="container">
    <h1>Persona 5</h1>
    <h2>Difficulté : Moyen</h2>

    <p>
        Tu penses connaître les Voleurs Fantômes ?  
        Alors voyons si tu es vraiment prêt à infiltrer le Palais du savoir.  
        Prépare ton masque… le quiz commence bientôt.
    </p>

    <button class="btn-start" onclick="location.href='quiz_persona5_moyen.html'">
        Commencer le quiz
    </button>
</div>

<script>
let musiqueActive = false;
const musique = document.getElementById("musiqueP5");
const btnMusique = document.getElementById("musiqueP5Btn");

function toggleMusique() {
    if (!musiqueActive) {
        musique.volume = 0.5;
        musique.play();
        musiqueActive = true;
        btnMusique.textContent = "Désactiver musique";
    } else {
        musique.pause();
        musiqueActive = false;
        btnMusique.textContent = "Activer musique";
    }
}
</script>

</body>
</html>
