<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Introduction – Quiz Pokémon Difficile</title>

    <style>
        body {
            background: url("c:/Users/Maxime/Pictures/fond quiz-pokemon DIFFICILE.png") no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: -1;
        }

        .container {
            background: rgba(255,255,255,0.5);
            padding: 30px;
            border-radius: 15px;
            max-width: 700px;
            margin: auto;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #ff0000;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.05);
        }

        .texte-aura {
            color: black;
            font-weight: bold;
            text-shadow:
                -2px -2px 0 rgb(179, 0, 255),
                 2px -2px 0 rgb(179, 0, 255),
                -2px  2px 0 rgb(179, 0, 255),
                 2px  2px 0 rgb(179, 0, 255),
                0px 0px 10px yellow,
                0px 0px 20px yellow,
                0px 0px 30px yellow;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="texte-aura">Quiz Pokémon – Difficulté Difficile</h1>

    <p class="texte-aura">
        Ce niveau est réservé aux dresseurs les plus expérimentés.  
        Attends‑toi à des questions pointues, des détails précis et des pièges.
        Prépare toi jeune maître et prépare tes meilleurs Pokémon !
    </p>

    <button onclick="window.location.href='quiz-pokemon-difficile.html'">
        Commencer le quiz
    </button>

    <!-- BOUTON ON/OFF MUSIQUE -->
    <button id="toggleMusique" onclick="toggleMusique()">Désactiver la musique</button>

</div>

<!-- MUSIQUE -->
<audio id="musiquePokemon" src="c:/Users/Maxime/Music/musique_quiz_pokemon_difficile.mp3" loop autoplay></audio>

<script>
    const audio = document.getElementById("musiquePokemon");
    const bouton = document.getElementById("toggleMusique");
    let musiqueActive = true;

    // Tentative d'autoplay (Chrome bloque parfois)
    window.addEventListener("load", () => {
        audio.volume = 0.4;
        audio.play().catch(() => {
            // Si Chrome bloque, on met le bouton en mode "Activer"
            musiqueActive = false;
            bouton.textContent = "Activer la musique";
        });
    });

    function toggleMusique() {
        if (!musiqueActive) {
            audio.play();
            musiqueActive = true;
            bouton.textContent = "Désactiver la musique";
        } else {
            audio.pause();
            musiqueActive = false;
            bouton.textContent = "Activer la musique";
        }
    }
</script>

</body>
</html>
