<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Introduction – Quiz Yo-kai Watch Difficile</title>

    <style>
        body {
            background: url("c:/Users/Maxime/Pictures/fond quiz-yokai-watch DIFFICILE.png") no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.35);
            z-index: -1;
        }

        .container {
            background: rgba(255,255,255,0.5);
            padding: 30px;
            border-radius: 15px;
            max-width: 700px;
            margin: auto;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        h1, p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #ff0000;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.05);
        }

        .texte-flammes {
            color: black;
            font-weight: bold;
            text-shadow:
                -2px -2px 0 red,
                 2px -2px 0 red,
                -2px  2px 0 red,
                 2px  2px 0 red,
                0px  0px 10px blue,
                0px  0px 20px blue,
                0px  0px 30px blue;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="texte-flammes">Quiz Yo-kai Watch – Difficulté Difficile</h1>

    <p class="texte-flammes">
        Prépare-toi…  
        Ce niveau est réservé aux vrais experts Yo-kai Watch.  
        Les questions seront plus précises, plus techniques, et parfois piégeuses.<br>
        C'est l'heure... de la <b>TERREUR'HEURE !</b>
    </p>

    <button onclick="window.location.href='quiz-yokaiwatch-difficile.html'">
        Commencer le quiz
    </button>

    <!-- BOUTON ON/OFF MUSIQUE -->
    <button id="toggleMusique" onclick="toggleMusique()">Activer la musique</button>

</div>

<!-- MUSIQUE -->
<audio id="musiqueOni" src="c:/Users/Maxime/Music/musique_quiz_yokai_difficile.mp3" loop></audio>

<script>
    const audio = document.getElementById("musiqueOni");
    const bouton = document.getElementById("toggleMusique");
    let musiqueActive = false;

    function toggleMusique() {
        if (!musiqueActive) {
            audio.volume = 0.4;
            audio.play();
            musiqueActive = true;
            bouton.textContent = "Désactiver la musique";
        } else {
            audio.pause();
            musiqueActive = false;
            bouton.textContent = "Activer la musique";
        }
    }
</script>

</body>
</html>
