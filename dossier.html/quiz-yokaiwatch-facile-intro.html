<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Quiz Yo-kai Watch - Introdction</title>

    <style>
        #toggleMusique {
    position: fixed;
    bottom: 20px;
    right: 20px;

    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: white;
    font-weight: bold;

    background: linear-gradient(135deg, #ff3b3b, #0066ff);
    box-shadow: 0 0 15px rgba(255, 80, 80, 0.7),
                0 0 15px rgba(80, 140, 255, 0.7);

    transition: 0.25s ease;
    z-index: 9999;
}

#toggleMusique:hover {
    transform: scale(1.1);
    background: linear-gradient(135deg, #ff5555, #1a7bff);
    box-shadow: 0 0 20px rgba(255, 100, 100, 0.9),
                0 0 20px rgba(100, 160, 255, 0.9);
}

#toggleMusique:active {
    transform: scale(0.95);
}

        body {
            background: url("c:/Users/Maxime/Pictures/fond quiz-yokai-watch.png") no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
            z-index: -1;
        }

        .container {
            background: rgba(255, 255, 255, 0.4);
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
            backdrop-filter: blur(5px);
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
        }

        button {
            margin-top: 25px;
            padding: 15px 25px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>

</head>
<body>
<button id="toggleMusique" onclick="toggleMusique()">Activer la musique</button>

<audio id="musiqueQuiz" src="c:\Users\Maxime\Music\musique_fond_yokaiwatch_facile.mp3" loop preload="auto"></audio>

    <div class="container">
        <h1>Quiz Yo-kai Watch – Niveau Facile</h1>
        <p>Tu vas commencer un quiz de 10 questions simples sur l’univers Yo-kai Watch.</p>
        <p>Tu auras 3 choix possibles à chaque question.</p>
        <p>Prépare ta montre et go !</p>

        <button onclick="window.location.href='quiz-yokaiwatch-facile.html'">Commencer le quiz</button>
    </div>
<script>
let musiqueActive = false;
const musique = document.getElementById("musiqueQuiz");
const boutonMusique = document.getElementById("toggleMusique");

function toggleMusique() {
    if (!musiqueActive) {
        musique.volume = 0.4;
        musique.play();
        musiqueActive = true;
        boutonMusique.textContent = "Désactiver la musique";
    } else {
        musique.pause();
        musiqueActive = false;
        boutonMusique.textContent = "Activer la musique";
    }
}
</script>

</body>
</html>
