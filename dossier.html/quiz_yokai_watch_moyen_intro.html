<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Intro – Quiz Yo-kai Watch (Moyen)</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;

            background: url("c:/Users/Maxime/Pictures/fond_quiz_yokaiwatch_moyen.png") no-repeat center center fixed;
            background-size: cover;

            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .container {
            margin-top: 120px;
            background: rgba(0,0,0,0.6);
            padding: 40px;
            border-radius: 20px;
            width: 60%;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 black;
            color: #00c8ff;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 25px;
            color: #ffe600;
            text-shadow: 2px 2px 0 black;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn-start {
            display: block;
            width: 260px;
            margin: 0 auto;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;

            background: linear-gradient(135deg, #00c8ff, #005eff);
            color: white;
            box-shadow: 0 0 15px rgba(0,200,255,0.8);
            transition: 0.25s ease;
        }

        .btn-start:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(0,200,255,1);
        }

        /* Bouton musique Yo-kai */
        #musiqueYokaiBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;

            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #ff0044, #000000);
            border: none;
            border-radius: 10px;
            cursor: pointer;

            box-shadow: 0 0 12px rgba(255,0,68,0.7),
                        0 0 12px rgba(0,0,0,0.8);
            transition: 0.25s ease;
            z-index: 9999;
        }

        #musiqueYokaiBtn:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

<button id="musiqueYokaiBtn" onclick="toggleMusique()">Activer musique</button>
<audio id="musiqueYokai" src="c:\Users\Maxime\Music\musique_quiz_yokaiwatch_moyen.mp3" loop preload="auto"></audio>

<div class="container">
    <h1>Quiz Yo-kai Watch</h1>
    <h2>Difficulté : Moyen</h2>

    <p>
        Prépare-toi à affronter des questions un peu plus corsées sur les Yo-kai !<br>
        Tu connais déjà bien l’univers ? Voyons si tu es vraiment prêt à relever le défi…
        Prend garde les Limbe Eternel ne serons pas tendre avec toi...
    </p>

    <button class="btn-start" onclick="location.href='quiz_yokai_moyen.html'">
        Commencer le quiz
    </button>
</div>

<script>
let musiqueActive = false;
const musique = document.getElementById("musiqueYokai");
const btnMusique = document.getElementById("musiqueYokaiBtn");

function toggleMusique() {
    if (!musiqueActive) {
        musique.volume = 0.5;
        musique.play();
        musiqueActive = true;
        btnMusique.textContent = "Désactiver musique";
    } else {
        musique.pause();
        musiqueActive = false;
        btnMusique.textContent = "Activer musique";
    }
}
</script>

</body>
</html>
